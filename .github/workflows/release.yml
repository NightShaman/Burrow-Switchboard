name: Release Burrow Switchboard development package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: burrow-switchboard-development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-Backend
          ref: main
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: core
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Standalone and current-Core contract gate
        run: |
          npm run build
          node --test test/server.test.mjs test/ui.test.mjs
          (cd core && npm ci --no-audit --no-fund)
          BURROW_CORE_ROOT="$GITHUB_WORKSPACE/core" npm run test:core
      - name: Assign calendar version
        id: version
        run: |
          set -eu
          base=$(date -u +%Y.%m.%d); version=$base; suffix=0
          while git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; do suffix=$((suffix + 1)); version="$base.$suffix"; done
          node scripts/set-release-version.mjs "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: node scripts/set-release-version.mjs "${{ steps.version.outputs.version }}" --check
      - name: Publish development package
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.version }}" }
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burrow.mod.json package.json
          git diff --cached --quiet || git commit -m "Release Burrow Switchboard $VERSION"
          git push origin HEAD:main
          git tag -a "$VERSION" -m "Burrow Switchboard $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Burrow Switchboard $VERSION (development)" --notes "NightShaman development package $VERSION."
